<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties | Real Estate Management System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Styling -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-houses-fill"></i>
        <span>REAL ESTATE</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="properties.html?purpose=BUY">Buy Property</a></li>
          <li class="nav-item"><a class="nav-link" href="properties.html?purpose=RENT">Rent Property</a></li>
          <li class="nav-item"><a class="nav-link" href="properties.html?category=AGRICULTURAL">Agricultural Land</a></li>
          <li class="nav-item"><a class="nav-link" href="properties.html?category=FARMHOUSE">Farmhouses</a></li>
          <li class="nav-item"><a class="nav-link" href="properties.html?category=PLOT">Plots</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-success" href="post-property.html"><i class="bi bi-plus-circle me-1"></i>Sell / Rent</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <a href="compare.html" id="nav-compare-link" class="btn btn-outline-secondary btn-sm position-relative">
            <i class="bi bi-arrow-left-right me-1"></i>Compare
            <span id="compare-count-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none">0</span>
          </a>
          <div id="nav-auth-container"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- SEARCH HEADER & FILTERS -->
  <div class="bg-white border-bottom py-4">
    <div class="container">
      <h3 class="fw-bold mb-3" id="page-heading">Browse Properties</h3>

      <div class="card p-3 shadow-sm border">
        <form id="filter-form" onsubmit="applyFilters(event)">
          <div class="row g-2 align-items-end">
            <!-- Keyword -->
            <div class="col-lg-3 col-md-6">
              <label class="form-label small fw-bold">Search Keywords</label>
              <input type="text" class="form-control form-control-sm" id="filter-keyword" placeholder="e.g. Villa, Indiranagar, Farmland">
            </div>

            <!-- City -->
            <div class="col-lg-2 col-md-3 col-6">
              <label class="form-label small fw-bold">City</label>
              <select class="form-select form-select-sm" id="filter-city">
                <option value="ALL">All Cities</option>
                <option value="Mysuru">Mysuru</option>
                <option value="Bengaluru">Bengaluru</option>
                <option value="Mandya">Mandya</option>
                <option value="Hassan">Hassan</option>
                <option value="Mangaluru">Mangaluru</option>
                <option value="Hubballi">Hubballi</option>
                <option value="Chennai">Chennai</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Pune">Pune</option>
              </select>
            </div>

            <!-- Category -->
            <div class="col-lg-2 col-md-3 col-6">
              <label class="form-label small fw-bold">Category</label>
              <select class="form-select form-select-sm" id="filter-category">
                <option value="ALL">All Categories</option>
                <option value="RESIDENTIAL">Residential</option>
                <option value="COMMERCIAL">Commercial</option>
                <option value="AGRICULTURAL">Agricultural Land</option>
                <option value="FARMHOUSE">Farmhouses</option>
                <option value="PLOT">Plots and Sites</option>
                <option value="BUILDING">Buildings & Projects</option>
              </select>
            </div>

            <!-- Purpose -->
            <div class="col-lg-2 col-md-3 col-6">
              <label class="form-label small fw-bold">Purpose</label>
              <select class="form-select form-select-sm" id="filter-purpose">
                <option value="ALL">All Purposes</option>
                <option value="BUY">Buy</option>
                <option value="RENT">Rent</option>
                <option value="LEASE">Lease</option>
              </select>
            </div>

            <!-- Sorting -->
            <div class="col-lg-2 col-md-3 col-6">
              <label class="form-label small fw-bold">Sort By</label>
              <select class="form-select form-select-sm" id="filter-sort">
                <option value="newest">Newest First</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
                <option value="area_desc">Area: Largest First</option>
              </select>
            </div>

            <!-- Filter Buttons -->
            <div class="col-lg-1 col-md-12">
              <button type="submit" class="btn btn-primary-custom btn-sm w-100 py-1">Apply</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- PROPERTY RESULTS GRID -->
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <p class="text-muted mb-0 small" id="results-count">Searching properties...</p>
      <button class="btn btn-link btn-sm text-decoration-none" onclick="resetFilters()">Reset Filters</button>
    </div>

    <div class="row g-4" id="properties-grid">
      <!-- Injected dynamically -->
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-success" role="status"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application Client -->
  <script src="js/app.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);

    function initFilterForm() {
      if (urlParams.get('city')) document.getElementById('filter-city').value = urlParams.get('city');
      if (urlParams.get('category')) document.getElementById('filter-category').value = urlParams.get('category');
      if (urlParams.get('purpose')) document.getElementById('filter-purpose').value = urlParams.get('purpose');
      if (urlParams.get('keyword')) document.getElementById('filter-keyword').value = urlParams.get('keyword');
      if (urlParams.get('sortBy')) document.getElementById('filter-sort').value = urlParams.get('sortBy');

      // Update heading
      const p = urlParams.get('purpose');
      const c = urlParams.get('category');
      if (p === 'BUY') document.getElementById('page-heading').textContent = 'Properties for Sale';
      else if (p === 'RENT') document.getElementById('page-heading').textContent = 'Properties for Rent';
      else if (c === 'AGRICULTURAL') document.getElementById('page-heading').textContent = 'Agricultural Land & Farmlands';
      else if (c === 'FARMHOUSE') document.getElementById('page-heading').textContent = 'Farmhouses & Luxury Estates';
      else if (c === 'PLOT') document.getElementById('page-heading').textContent = 'Plots & Construction Sites';
    }

    async function loadProperties() {
      const grid = document.getElementById('properties-grid');
      const countEl = document.getElementById('results-count');

      const params = new URLSearchParams(window.location.search);

      try {
        const res = await fetch('/api/properties?' + params.toString());
        const json = await res.json();

        if (json.status === 'success' && json.data) {
          const list = json.data;
          countEl.textContent = `Showing ${list.length} verified propert${list.length === 1 ? 'y' : 'ies'}`;

          if (list.length === 0) {
            grid.innerHTML = `
              <div class="col-12 text-center py-5">
                <i class="bi bi-search display-4 text-muted mb-3 d-inline-block"></i>
                <h5 class="fw-bold">No Properties Found</h5>
                <p class="text-muted">Try adjusting your filters or search keywords.</p>
                <button class="btn btn-outline-custom btn-sm mt-2" onclick="resetFilters()">Reset Filters</button>
              </div>
            `;
            return;
          }

          grid.innerHTML = list.map(p => {
            const purposeBadgeClass = p.purpose === 'BUY' ? 'badge-buy' : (p.purpose === 'RENT' ? 'badge-rent' : 'badge-lease');
            const inCompare = App.compareList.includes(p.propertyId);

            return `
              <div class="col-lg-4 col-md-6">
                <div class="property-card">
                  <div class="property-img-wrapper">
                    <img src="${p.primaryImageUrl || 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1000&q=80'}" alt="${App.escapeHtml(p.title)}" class="property-img">
                    <span class="badge-purpose ${purposeBadgeClass}">${p.purpose}</span>
                    <span class="badge-category">${App.escapeHtml(p.categoryName)}</span>
                  </div>
                  <div class="property-body">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                      <div class="property-price">${App.formatPrice(p.price, p.purpose)}</div>
                      ${p.ownerVerified ? '<span class="badge-verified"><i class="bi bi-patch-check-fill"></i> Verified</span>' : ''}
                    </div>
                    <h5 class="property-title">${App.escapeHtml(p.title)}</h5>
                    <div class="property-location">
                      <i class="bi bi-geo-alt"></i> ${App.escapeHtml(p.locality)}, ${App.escapeHtml(p.city)}
                    </div>
                    <div class="property-features">
                      <span><i class="bi bi-aspect-ratio"></i> ${p.propertyArea} ${App.escapeHtml(p.areaUnit)}</span>
                      ${p.bedrooms > 0 ? `<span><i class="bi bi-door-open"></i> ${p.bedrooms} Beds</span>` : ''}
                      ${p.bathrooms > 0 ? `<span><i class="bi bi-water"></i> ${p.bathrooms} Baths</span>` : ''}
                    </div>
                    <div class="d-flex gap-2 mt-3 pt-2">
                      <a href="property-details.html?id=${p.propertyId}" class="btn btn-navy btn-sm flex-grow-1">View Details</a>
                      <button type="button" class="btn ${inCompare ? 'btn-primary-custom' : 'btn-outline-secondary'} btn-sm px-3" onclick="App.toggleCompare(${p.propertyId}, this)">
                        <i class="bi ${inCompare ? 'bi-check2' : 'bi-arrow-left-right'}"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        grid.innerHTML = '<div class="col-12 text-center text-danger py-5">Error loading properties from server.</div>';
      }
    }

    function applyFilters(e) {
      e.preventDefault();
      const params = new URLSearchParams();
      const kw = document.getElementById('filter-keyword').value;
      const city = document.getElementById('filter-city').value;
      const cat = document.getElementById('filter-category').value;
      const pur = document.getElementById('filter-purpose').value;
      const sort = document.getElementById('filter-sort').value;

      if (kw) params.append('keyword', kw);
      if (city && city !== 'ALL') params.append('city', city);
      if (cat && cat !== 'ALL') params.append('category', cat);
      if (pur && pur !== 'ALL') params.append('purpose', pur);
      if (sort) params.append('sortBy', sort);

      window.location.search = params.toString();
    }

    function resetFilters() {
      window.location.href = 'properties.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      initFilterForm();
      loadProperties();
    });
  </script>
</body>
</html>
