<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamHome | 3D Property Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --bg: #0f172a; --emerald: #10b981; --text: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dh-studio-header {
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 20;
    }
    .dh-brand-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dh-logo { font-weight: 800; font-size: 15px; color: #fff; white-space: nowrap; }
    .dh-logo span { color: var(--emerald); }
    .dh-badge { background: rgba(16,185,129,0.18); color: #34d399; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .dh-title { font-size: 13.5px; font-weight: 700; color: #e2e8f0; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .dh-controls-wrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .dh-pill-group { display: flex; gap: 3px; background: rgba(255,255,255,0.06); padding: 3px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.08); overflow-x: auto; max-width: 100%; }
    .dh-pill {
      border: none;
      background: transparent;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .dh-pill:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .dh-pill.active { background: var(--emerald); color: #fff; }

    .dh-rooms-bar {
      background: #0b1120;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 6px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 15;
    }
    .dh-meta { display: flex; gap: 12px; align-items: center; font-size: 12px; color: #94a3b8; }
    .dh-price { color: #34d399; font-weight: 800; }
    .dh-arch-label { color: #38bdf8; font-weight: 700; font-size: 11px; text-transform: uppercase; }

    #dh-3d-canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
      overflow: hidden;
    }
    #dh-3d-canvas-container:active { cursor: grabbing; }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 45%, #1e293b 0%, #090e1a 100%);
      display: none;
      z-index: 12;
    }
    model-viewer.active { display: block; }

    .hint-badge {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }

    @media (max-width: 720px) {
      .dh-title { max-width: 140px; font-size: 12px; }
      .dh-pill { padding: 4px 6px; font-size: 10px; }
      .hint-badge { display: none; }
    }
  </style>
</head>
<body>

<div class="dh-studio-header">
  <div class="dh-brand-wrap">
    <div class="dh-logo">Dream<span>Home</span></div>
    <span class="dh-badge">3D Studio</span>
    <span class="dh-title" id="prop-heading">Loading...</span>
  </div>

  <div class="dh-controls-wrap">
    <div class="dh-pill-group">
      <button class="dh-pill active" id="btnDay" onclick="setLighting('day', this)">☀️ Day</button>
      <button class="dh-pill" id="btnSunset" onclick="setLighting('sunset', this)">🌅 Sunset</button>
      <button class="dh-pill" id="btnNight" onclick="setLighting('night', this)">🌙 Night</button>
    </div>
    <div class="dh-pill-group">
      <button class="dh-pill" id="btnRotate" onclick="toggleRotate(this)">🔄 Auto-Rotate</button>
      <button class="dh-pill" id="btnGlb" onclick="toggleGlbMode(this)">📦 GLB</button>
    </div>
  </div>
</div>

<div class="dh-rooms-bar">
  <div class="dh-pill-group" id="roomButtons">
    <button class="dh-pill active" onclick="focusRoom('exterior', this)">🏠 Exterior</button>
    <button class="dh-pill" onclick="focusRoom('floorplan', this)">✂️ Full Interior</button>
    <button class="dh-pill" onclick="focusRoom('living', this)">🛋️ Living</button>
    <button class="dh-pill" onclick="focusRoom('kitchen', this)">🍳 Kitchen</button>
    <button class="dh-pill" onclick="focusRoom('dining', this)">🍽️ Dining</button>
    <button class="dh-pill" onclick="focusRoom('bedroom', this)">🛏️ Bedroom</button>
    <button class="dh-pill" onclick="focusRoom('bathroom', this)">🚿 Bathroom</button>
    <button class="dh-pill" onclick="focusRoom('pooja', this)">🛕 Pooja Room</button>
    <button class="dh-pill" onclick="focusRoom('pool', this)">🏊 Pool</button>
  </div>
  <div class="dh-meta">
    <span class="dh-arch-label" id="prop-arch-name"></span>
    <span id="prop-location">📍 Loading...</span>
    <span class="dh-price" id="prop-price"></span>
  </div>
</div>

<div id="dh-3d-canvas-container">
  <model-viewer
    id="glbViewer"
    src="/models/modern_home.glb"
    alt="3D property model"
    camera-controls
    min-camera-orbit="auto 0deg auto"
    max-camera-orbit="auto 180deg auto"
    shadow-intensity="1.2"
    environment-image="neutral">
  </model-viewer>
  <div class="hint-badge">Left-drag: Turn 360° freely · Right-drag: Pan · Scroll: Zoom · Click any room above</div>
</div>

<script>
const container = document.getElementById('dh-3d-canvas-container');
const glbViewer = document.getElementById('glbViewer');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbeafe);
scene.fog = new THREE.FogExp2(0xdbeafe, 0.009);

const camera = new THREE.PerspectiveCamera(44, container.clientWidth / container.clientHeight, 0.1, 220);
camera.position.set(16, 12, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = true;
controls.enableZoom = true;
controls.minDistance = 1.2;
controls.maxDistance = 65;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.8;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.72);
scene.add(ambientLight);
const hemiLight = new THREE.HemisphereLight(0xe0f2fe, 0x334155, 0.55);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xfffbeb, 1.35);
dirLight.position.set(16, 26, 16);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
const sc = 22;
dirLight.shadow.camera.left = -sc;
dirLight.shadow.camera.right = sc;
dirLight.shadow.camera.top = sc;
dirLight.shadow.camera.bottom = -sc;
scene.add(dirLight);

const interiorLights = [];

function makeWoodTex() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9a6b42';
  ctx.fillRect(0, 0, 128, 128);
  for (let y = 0; y < 128; y += 16) {
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0, y, 128, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 4);
  return t;
}

function makeTileTex(c1, c2) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = c1;
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = c2;
  for (let y = 0; y < 128; y += 32) ctx.fillRect(0, y, 128, 1.5);
  for (let x = 0; x < 128; x += 32) ctx.fillRect(x, 0, 1.5, 128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
}

const woodFloorTex = makeWoodTex();
const bathTileTex = makeTileTex('#e2e8f0', '#94a3b8');
const kitchenTileTex = makeTileTex('#f1f5f9', '#cbd5e1');
const athangudiTex = makeTileTex('#fef3c7', '#b45309');

let houseGroup = null;
let exteriorRoofGroup = null;
let exteriorFrontWallsGroup = null;
let currentViews = {};

function box(parent, w, h, d, mat, x, y, z, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cyl(parent, rt, rb, h, seg, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function addTree(parent, x, z, sc = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  cyl(g, 0.08 * sc, 0.14 * sc, 1.8 * sc, 10, new THREE.MeshStandardMaterial({ color: 0x4a3222, roughness: 0.9 }), 0, 0.9 * sc, 0);
  [0x1e4625, 0x265830, 0x2f683a].forEach((col, i) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry((0.72 - i * 0.1) * sc, 14, 12), new THREE.MeshStandardMaterial({ color: col, roughness: 0.88 }));
    s.position.set((i === 1 ? -0.35 : i === 2 ? 0.35 : 0) * sc, (2.0 - i * 0.12) * sc, (i === 1 ? 0.25 : -0.2) * sc);
    s.scale.set(1.15, 0.85, 1.15);
    s.castShadow = true;
    g.add(s);
  });
  parent.add(g);
}

// --- Furnished Room Builders ---
function buildLivingFurniture(parent, cx, cz, mats) {
  box(parent, 2.8, 0.04, 2.0, mats.rug, cx, 0.16, cz, false);
  box(parent, 2.3, 0.45, 0.85, mats.sofa, cx, 0.36, cz - 1.0);
  box(parent, 0.85, 0.45, 1.5, mats.sofa, cx - 0.8, 0.36, cz - 0.1);
  box(parent, 1.2, 0.28, 0.65, mats.marble, cx + 0.1, 0.3, cz + 0.1);
  box(parent, 1.8, 0.38, 0.38, mats.wood, cx, 0.34, cz + 1.4);
  box(parent, 1.4, 0.8, 0.06, mats.dark, cx, 1.08, cz + 1.45);
}

function buildKitchenFurniture(parent, cx, cz, mats) {
  box(parent, 2.6, 0.9, 0.65, mats.dark, cx, 0.58, cz - 1.2);
  box(parent, 2.65, 0.06, 0.7, mats.marble, cx, 1.04, cz - 1.2);
  box(parent, 2.2, 0.68, 0.4, mats.wood, cx - 0.1, 2.1, cz - 1.32);
  box(parent, 0.75, 1.9, 0.72, mats.chrome, cx + 1.0, 1.08, cz - 0.3);
  box(parent, 1.6, 0.9, 0.75, mats.dark, cx, 0.58, cz + 0.8);
  box(parent, 1.7, 0.06, 0.85, mats.marble, cx, 1.04, cz + 0.8);
  [cx - 0.4, cx + 0.4].forEach(sx => cyl(parent, 0.16, 0.16, 0.62, 12, mats.accent, sx, 0.44, cz + 1.45));
}

function buildDiningFurniture(parent, cx, cz, mats) {
  box(parent, 1.8, 0.08, 1.05, mats.wood, cx, 0.82, cz);
  [[-0.55, -0.4], [0.55, -0.4], [-0.55, 0.4], [0.55, 0.4]].forEach(([dx, dz]) => {
    box(parent, 0.07, 0.72, 0.07, mats.dark, cx + dx, 0.44, cz + dz);
  });
  [[0, -0.75], [0, 0.75], [-1.15, 0], [1.15, 0]].forEach(([dx, dz]) => {
    box(parent, 0.4, 0.45, 0.4, mats.accent, cx + dx, 0.36, cz + dz);
  });
  cyl(parent, 0.2, 0.3, 0.18, 16, mats.glow, cx, 2.1, cz);
}

function buildBedroomFurniture(parent, cx, cz, mats) {
  box(parent, 1.7, 0.32, 2.1, mats.wood, cx, 0.28, cz);
  box(parent, 1.6, 0.22, 2.0, mats.bed, cx, 0.52, cz);
  box(parent, 1.6, 0.14, 1.2, mats.duvet, cx, 0.6, cz + 0.35);
  box(parent, 0.62, 0.12, 0.38, mats.marble, cx - 0.4, 0.68, cz - 0.75);
  box(parent, 0.62, 0.12, 0.38, mats.marble, cx + 0.4, 0.68, cz - 0.75);
  box(parent, 1.8, 1.0, 0.1, mats.wood, cx, 0.7, cz - 1.12);
  box(parent, 0.42, 0.45, 0.42, mats.wood, cx - 1.15, 0.35, cz - 0.9);
  cyl(parent, 0.12, 0.15, 0.22, 12, mats.glow, cx - 1.15, 0.7, cz - 0.9);
}

function buildBathroomFurniture(parent, cx, cz, mats) {
  box(parent, 1.6, 0.5, 0.8, mats.marble, cx - 0.5, 0.38, cz - 0.9);
  box(parent, 1.35, 0.12, 0.6, mats.pool, cx - 0.5, 0.58, cz - 0.9, false);
  box(parent, 1.0, 1.9, 0.05, mats.glass, cx + 0.6, 1.1, cz - 0.4, false);
  box(parent, 0.05, 1.9, 1.0, mats.glass, cx + 0.1, 1.1, cz - 0.9, false);
  box(parent, 1.2, 0.75, 0.5, mats.wood, cx - 0.5, 0.5, cz + 0.9);
  box(parent, 0.5, 0.1, 0.38, mats.marble, cx - 0.5, 0.9, cz + 0.9);
  box(parent, 0.42, 0.4, 0.55, mats.marble, cx + 0.8, 0.32, cz + 0.9);
}

// --- Dedicated Indian Cultural Pooja / Temple Room Builder ---
function buildPoojaTempleRoom(parent, cx, cz, mats) {
  const teak = new THREE.MeshStandardMaterial({ color: 0x6d3514, roughness: 0.45 });
  const gold = new THREE.MeshStandardMaterial({ color: 0xf59e0b, emissive: 0xd97706, emissiveIntensity: 0.45, metalness: 0.75, roughness: 0.25 });
  const diyaGlow = new THREE.MeshStandardMaterial({ color: 0xfffbeb, emissive: 0xfbbf24, emissiveIntensity: 2.2 });
  const rangoliMat = new THREE.MeshStandardMaterial({ color: 0xec4899, roughness: 0.8 });

  // Marble Pooja Floor Mat + Rangoli
  box(parent, 2.2, 0.04, 2.2, mats.marble, cx, 0.16, cz, false);
  cyl(parent, 0.45, 0.45, 0.02, 24, rangoliMat, cx, 0.19, cz + 0.55);
  cyl(parent, 0.24, 0.24, 0.025, 24, gold, cx, 0.195, cz + 0.55);

  // Carved Teakwood Mandapam Base & Altar
  box(parent, 1.5, 0.45, 0.9, teak, cx, 0.38, cz - 0.6);
  box(parent, 1.6, 0.06, 0.96, mats.marble, cx, 0.62, cz - 0.6);

  // 4 Temple Pillars
  [[-0.65, -0.95], [0.65, -0.95], [-0.65, -0.25], [0.65, -0.25]].forEach(([px, pz]) => {
    cyl(parent, 0.06, 0.07, 1.35, 12, teak, cx + px, 1.3, cz + pz);
  });

  // Stepped Gopuram / Shikhar Temple Roof + Golden Kalash
  box(parent, 1.6, 0.12, 1.0, teak, cx, 2.0, cz - 0.6);
  box(parent, 1.15, 0.18, 0.72, teak, cx, 2.15, cz - 0.6);
  box(parent, 0.7, 0.18, 0.45, gold, cx, 2.32, cz - 0.6);
  cyl(parent, 0.02, 0.1, 0.28, 12, gold, cx, 2.54, cz - 0.6); // Golden Kalash spire

  // Sacred Golden Idol & Brass Diya Oil Lamps
  box(parent, 0.38, 0.48, 0.24, gold, cx, 0.88, cz - 0.65);
  cyl(parent, 0.08, 0.14, 0.18, 12, gold, cx, 1.2, cz - 0.65); // Crown
  [-0.42, 0.42].forEach(dx => {
    cyl(parent, 0.06, 0.09, 0.22, 12, gold, cx + dx, 0.76, cz - 0.32);
    cyl(parent, 0.04, 0.04, 0.08, 10, diyaGlow, cx + dx, 0.9, cz - 0.32); // Glowing Diya flame
  });

  // Warm Temple PointLight
  const templeLight = new THREE.PointLight(0xfbbf24, 1.6, 6);
  templeLight.position.set(cx, 1.7, cz - 0.2);
  scene.add(templeLight);
  interiorLights.push(templeLight);
}

const ARCH_THEMES = [
  { wall: 0xf8fafc, dark: 0x1e293b, accent: 0xb45309, sofa: 0x334155 },
  { wall: 0xfefce8, dark: 0x292524, accent: 0x0f766e, sofa: 0x44403c },
  { wall: 0xe2e8f0, dark: 0x0f172a, accent: 0x0284c7, sofa: 0x1e293b },
  { wall: 0xf5f5f4, dark: 0x27272a, accent: 0x9a3412, sofa: 0x3f3f46 },
  { wall: 0xecfdf5, dark: 0x1e293b, accent: 0x15803d, sofa: 0x374151 }
];

function resolveArchModel(p) {
  const cat = (p.categoryCode || 'RESIDENTIAL').toUpperCase();
  const title = (p.title || '').toLowerCase();
  const pid = Math.abs(Number(p.propertyId || 101));
  if (title.includes('chettinad') || title.includes('nalukettu') || title.includes('pooja') || title.includes('temple') || title.includes('heritage') || title.includes('vastu') || title.includes('haveli')) return 'indian_heritage';
  if (cat === 'COMMERCIAL' || title.includes('tech park') || title.includes('office')) return 'commercial';
  if (cat === 'BUILDING' || title.includes('penthouse') || title.includes('apartment') || title.includes('flat') || title.includes('sky')) return 'penthouse';
  if (cat === 'FARMHOUSE' || cat === 'AGRICULTURAL' || title.includes('farm') || title.includes('plantation') || title.includes('estate')) return 'farmhouse';
  if (cat === 'PLOT' || title.includes('plot') || title.includes('site') || title.includes('duplex') || title.includes('row house')) return 'duplex';
  const styles = ['courtyard_villa', 'indian_heritage', 'duplex'];
  return styles[pid % styles.length];
}

function buildDistinctPropertyModel(p) {
  if (houseGroup) scene.remove(houseGroup);
  interiorLights.forEach(l => scene.remove(l));
  interiorLights.length = 0;

  const pid = Math.abs(Number(p.propertyId || 101));
  const arch = resolveArchModel(p);
  const th = ARCH_THEMES[pid % ARCH_THEMES.length];

  houseGroup = new THREE.Group();
  exteriorRoofGroup = new THREE.Group();
  exteriorFrontWallsGroup = new THREE.Group();
  houseGroup.add(exteriorRoofGroup);
  houseGroup.add(exteriorFrontWallsGroup);

  const mats = {
    wall: new THREE.MeshStandardMaterial({ color: th.wall, roughness: 0.6 }),
    dark: new THREE.MeshStandardMaterial({ color: th.dark, roughness: 0.55 }),
    accent: new THREE.MeshStandardMaterial({ color: th.accent, roughness: 0.5 }),
    wood: new THREE.MeshStandardMaterial({ map: woodFloorTex, roughness: 0.55 }),
    bath: new THREE.MeshStandardMaterial({ map: bathTileTex, roughness: 0.35 }),
    kitchen: new THREE.MeshStandardMaterial({ map: kitchenTileTex, roughness: 0.4 }),
    athangudi: new THREE.MeshStandardMaterial({ map: athangudiTex, roughness: 0.45 }),
    marble: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 }),
    chrome: new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.2, metalness: 0.85 }),
    glass: new THREE.MeshPhysicalMaterial({ color: 0xbae6fd, transparent: true, opacity: 0.32, roughness: 0.08, side: THREE.DoubleSide }),
    sofa: new THREE.MeshStandardMaterial({ color: th.sofa, roughness: 0.85 }),
    bed: new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 }),
    duvet: new THREE.MeshStandardMaterial({ color: th.accent, roughness: 0.75 }),
    rug: new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.9 }),
    lawn: new THREE.MeshStandardMaterial({ color: 0x2d6a3e, roughness: 0.92 }),
    deck: new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.85 }),
    pool: new THREE.MeshPhysicalMaterial({ color: 0x06b6d4, emissive: 0x0891b2, emissiveIntensity: 0.45, transparent: true, opacity: 0.86, roughness: 0.08 }),
    glow: new THREE.MeshStandardMaterial({ color: 0xfffbeb, emissive: 0xfbbf24, emissiveIntensity: 1.4 }),
    terracotta: new THREE.MeshStandardMaterial({ color: 0xb44326, roughness: 0.68 })
  };

  if (arch === 'indian_heritage') {
    document.getElementById('prop-arch-name').textContent = 'Indian Vaastu Heritage Home & Pooja Mandap';
    box(houseGroup, 20, 0.35, 15, mats.lawn, 0, -0.2, 0, false);
    // Traditional Front Verandah & Courtyard Pool
    box(houseGroup, 11.6, 0.16, 10.2, mats.athangudi, -1.2, 0.08, 0, false);
    box(houseGroup, 4.4, 0.16, 5.8, mats.pool, 6.8, 0.09, 0.5, false);
    box(houseGroup, 5.2, 0.12, 7.0, mats.deck, 6.8, 0.06, 0.5, false);

    // Kitchen & Bath tile zones
    box(houseGroup, 3.2, 0.17, 3.8, mats.kitchen, 2.6, 0.09, -3.0, false);

let targetCam = new THREE.Vector3(16, 11.5, 18);
let targetLook = new THREE.Vector3(0, 1.8, 0);
let transitioning = false;

window.focusRoom = function(room, btn) {
  glbViewer.classList.remove('active');
  document.getElementById('btnGlb').classList.remove('active');
  document.querySelectorAll('#roomButtons .dh-pill').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');

  const cfg = currentViews[room] || currentViews.exterior;
  if (exteriorRoofGroup) exteriorRoofGroup.visible = cfg.roof;
  if (exteriorFrontWallsGroup) exteriorFrontWallsGroup.visible = cfg.roof;

  targetCam.set(...cfg.cam);
  targetLook.set(...cfg.look);
  transitioning = true;
};

window.toggleGlbMode = function(btn) {
  btn.classList.toggle('active');
  glbViewer.classList.toggle('active', btn.classList.contains('active'));
};

window.toggleRotate = function(btn) {
  controls.autoRotate = !controls.autoRotate;
  btn.classList.toggle('active', controls.autoRotate);
};

window.setLighting = function(mode, btn) {
  btn.parentElement.querySelectorAll('.dh-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'day') {
    scene.background.setHex(0xdbeafe); scene.fog.color.setHex(0xdbeafe);
    dirLight.color.setHex(0xfffbeb); dirLight.intensity = 1.35; ambientLight.intensity = 0.72;
    interiorLights.forEach(l => l.intensity = 1.0);
  } else if (mode === 'sunset') {
    scene.background.setHex(0xfed7aa); scene.fog.color.setHex(0xfed7aa);
    dirLight.color.setHex(0xf97316); dirLight.intensity = 1.5; ambientLight.intensity = 0.55;
    interiorLights.forEach(l => l.intensity = 1.8);
  } else {
    scene.background.setHex(0x0f172a); scene.fog.color.setHex(0x0f172a);
    dirLight.color.setHex(0x60a5fa); dirLight.intensity = 0.45; ambientLight.intensity = 0.28;
    interiorLights.forEach(l => l.intensity = 2.6);
  }
};

    const res = await fetch('/api/properties/details?id=' + encodeURIComponent(propId));
    const json = await res.json();
    if (json.status === 'success' && json.data) {
      const p = json.data;
      document.getElementById('prop-heading').textContent = p.title || 'Property 3D View';
      document.getElementById('prop-location').textContent = '📍 ' + (p.locality || p.city || 'Mysuru') + ', ' + (p.state || 'Karnataka');
      document.getElementById('prop-price').textContent = '₹' + Number(p.price || 0).toLocaleString('en-IN') + (p.purpose === 'RENT' ? ' / mo' : '');
      glbViewer.setAttribute('src', p.model3dUrl || '/models/modern_home.glb');
      buildDistinctPropertyModel(p);
      return;
    }
  } catch (err) {
    console.warn('Using fallback property model:', err);
  }
  buildDistinctPropertyModel({ propertyId: Number(propId) || 101, categoryCode: 'RESIDENTIAL', title: 'Luxury Villa' });
}

initProperty3D();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

function animate() {
  requestAnimationFrame(animate);
  if (transitioning) {
    camera.position.lerp(targetCam, 0.08);
    controls.target.lerp(targetLook, 0.08);
    if (camera.position.distanceTo(targetCam) < 0.08) transitioning = false;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
